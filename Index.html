<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="Assets/css/style.css">
        <link rel="stylesheet" href="Assets/css/hover.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Meow+Script&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    </head>

    <body>
        <div class="main-container">
            <div class="sidebar-container">
                <div class="sidebar">
                    
                    <div class="users">
                        <button><img src="./Assets/Images/kitty.png" alt="kitty">Users <span class="material-symbols-outlined">keyboard_arrow_down</span></button>
                    </div>

                    <div class="members">
                        <li>Members</li>
                        <div class="members-icon">
                            <img class="members-images" src="./Assets/Images/firstimg.png" alt="">
                            <img class="members-images" src="./Assets/Images/MyImage.jpeg" alt="">
                            <img class="members-images" src="./Assets/Images/stone.jpeg" alt="">
                            <img class="members-images" src="./Assets/Images/tree.jpeg" alt="">
                        </div>
                    </div>


                    <div class="navigation-options">
                        <span>Navigation</span>
                        <ul>
                            
                            <li><i class="material-symbols-outlined">home_app_logo</i> <span>Home</span></li>
                            <li><i class="material-symbols-outlined">door_front</i> Rooms</li>
                            <li><i class="material-symbols-outlined">device_hub</i> Devices</li>
                            <li><i class="material-symbols-outlined">alarm</i> Schedule</li>
                            <li><i class="material-symbols-outlined">menu_book</i> Logs</li>
                            <li><i class="material-symbols-outlined">settings</i> Settings</li>
                        </ul>
                    </div>

                    <div class="weather-updates">
                        
                    </div>

                    <div class="logout">
                        
                        <button class="Btn">
                            <div class="sign">
                                <i class="material-symbols-outlined">logout</i>
                            </div>

                          <div class="text">Logout</div>
                        </button>

                    </div>

                    <div class="sidebar-footer">
                        <small>Made with 🥰</small>
                    </div>
                </div>
            </div>

            <div class="content-container">
                <div class="content">

                </div>
            </div>

        </div>
    </body>
</html>
